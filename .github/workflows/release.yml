name: Release

on:
  release:
    types: [published]

jobs:
  build-and-release:
    runs-on: macos-26
    permissions:
      contents: write

    env:
      APP_NAME: WeatherKitTest
      DERIVED_DATA: /tmp/DerivedData
      DIST_DIR: /tmp/dist

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Download Sparkle tools
        run: |
          SPARKLE_VERSION="2.8.1"
          curl -L -o sparkle.tar.xz "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          tar -xf sparkle.tar.xz
          GENERATE_APPCAT_PATH="$(find "$PWD" -type f \( -name 'generate_appcast' -o -name 'generate-appcast' \) | head -n 1)"
          SPARKLE_BIN="$(dirname "$GENERATE_APPCAT_PATH")"
          echo "SPARKLE_BIN=$SPARKLE_BIN" >> "$GITHUB_ENV"
          echo "SPARKLE_APPCAST_TOOL=$GENERATE_APPCAT_PATH" >> "$GITHUB_ENV"

      - name: Import signing certificate
        env:
          CERT_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$CERT_BASE64" ]; then
            echo "No Developer ID certificate provided. Skipping codesign import."
            exit 0
          fi
          echo "$CERT_BASE64" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -l build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain
          security find-identity -p codesigning -v build.keychain
          DEVID_SHA=$(security find-identity -p codesigning -v build.keychain | awk -F\" '/Developer ID Application/ {print $2; exit}')
          if [ -z "$DEVID_SHA" ]; then
            echo "Developer ID Application identity not found in build.keychain"
            exit 1
          fi
          echo "DEVELOPER_ID_SHA=$DEVID_SHA" >> "$GITHUB_ENV"

      - name: Install WeatherKit provisioning profile
        env:
          WK_PROFILE_BASE64: ${{ secrets.WEATHERKIT_PROFILE_BASE64 }}
        run: |
          if [ -z "$WK_PROFILE_BASE64" ]; then
            echo "WeatherKit provisioning profile not provided."
            exit 1
          fi
          PROFILE_PATH="$RUNNER_TEMP/WeatherKit.provisionprofile"
          echo "$WK_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.provisionprofile
          echo "WK_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Build app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          xcodebuild \
            -project WeatherKitTest.xcodeproj \
            -scheme WeatherKitTest \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath "$DERIVED_DATA" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$DEVELOPER_ID_SHA" \
            CODE_SIGN_KEYCHAIN=build.keychain \
            OTHER_CODE_SIGN_FLAGS="--keychain build.keychain --options runtime --timestamp" \
            DEVELOPMENT_TEAM="KALT4PNG4U" \
            PROVISIONING_PROFILE_SPECIFIER="$WK_PROFILE_UUID" \
            PROVISIONING_PROFILE="$WK_PROFILE_UUID" \
            MACOSX_DEPLOYMENT_TARGET=15.5 \
            build

      - name: Re-sign Sparkle helpers (notarization)
        run: |
          APP_PATH="$DERIVED_DATA/Build/Products/Release/$APP_NAME.app"
          SPARKLE_FW="$APP_PATH/Contents/Frameworks/Sparkle.framework"
          if [ ! -d "$SPARKLE_FW" ]; then
            echo "Sparkle.framework not embedded at $SPARKLE_FW"
            exit 1
          fi

          IDENTITY="$DEVELOPER_ID_SHA"
          # Use a dedicated distribution entitlements file. This avoids `get-task-allow` and
          # avoids build-setting placeholders that codesign won't expand.
          APP_ENTITLEMENTS="$GITHUB_WORKSPACE/WeatherKitTest/WeatherKitTestDistribution.entitlements"
          SPARKLE_UPDATER_ENTITLEMENTS="$GITHUB_WORKSPACE/WeatherKitTest/SparkleUpdater.entitlements"
          if [ ! -f "$APP_ENTITLEMENTS" ]; then
            echo "Missing entitlements file at $APP_ENTITLEMENTS"
            exit 1
          fi
          if [ ! -f "$SPARKLE_UPDATER_ENTITLEMENTS" ]; then
            echo "Missing entitlements file at $SPARKLE_UPDATER_ENTITLEMENTS"
            exit 1
          fi

          # Resign nested Sparkle bundles with our Developer ID + timestamp so notary accepts them.
          # Order matters: inner bundles first, then framework, then the app.
          while IFS= read -r -d '' bundle; do
            extra=()
            if [[ "$bundle" == *.app ]]; then
              extra+=(--entitlements "$SPARKLE_UPDATER_ENTITLEMENTS")
            fi
            # When signing a .app bundle, ensure the main executable gets the entitlement too.
            # (Signing only the bundle directory can be finicky across Xcode/SDK versions.)
            if [[ "$bundle" == *.app ]] && [ -d "$bundle/Contents/MacOS" ]; then
              while IFS= read -r -d '' exe; do
                if /usr/bin/file "$exe" | /usr/bin/grep -q "Mach-O"; then
                  /usr/bin/codesign --force --sign "$IDENTITY" \
                    --keychain build.keychain \
                    --options runtime --timestamp \
                    --entitlements "$SPARKLE_UPDATER_ENTITLEMENTS" \
                    --preserve-metadata=identifier,requirements,flags \
                    "$exe"
                fi
              done < <(find "$bundle/Contents/MacOS" -type f -print0)
            fi
            /usr/bin/codesign --force --sign "$IDENTITY" \
              --keychain build.keychain \
              --options runtime --timestamp \
              --preserve-metadata=identifier,requirements,flags \
              "${extra[@]}" \
              "$bundle"
          done < <(find "$SPARKLE_FW" -mindepth 2 -type d \( -name "*.app" -o -name "*.xpc" \) -print0)

          # Sparkle also ships standalone Mach-O helpers (e.g. Autoupdate) inside the framework.
          while IFS= read -r -d '' macho; do
            # Only sign loose Mach-O files that are not inside a nested code bundle (.app/.xpc),
            # otherwise we can accidentally wipe entitlements that are required (e.g. AppleEvents).
            if [[ "$macho" == *".app/"* ]] || [[ "$macho" == *".xpc/"* ]]; then
              continue
            fi
            if /usr/bin/file "$macho" | /usr/bin/grep -q "Mach-O"; then
              /usr/bin/codesign --force --sign "$IDENTITY" \
                --keychain build.keychain \
                --options runtime --timestamp \
                --preserve-metadata=identifier,requirements,flags \
                "$macho"
            fi
          done < <(find "$SPARKLE_FW" -type f -print0)

          # Ensure Sparkle's Autoupdate helper is signed with our Developer ID + timestamp.
          AUToupdate_BIN="$(find "$SPARKLE_FW" -path '*/Versions/*/Autoupdate' -type f | head -n 1)"
          if [ -n "$AUToupdate_BIN" ]; then
            /usr/bin/codesign --force --sign "$IDENTITY" \
              --keychain build.keychain \
              --options runtime --timestamp \
              "$AUToupdate_BIN"
            /usr/bin/codesign -dv --verbose=4 "$AUToupdate_BIN" 2>&1 | /usr/bin/grep -E "Authority=|Timestamp=" || true
          fi

          /usr/bin/codesign --force --sign "$IDENTITY" \
            --keychain build.keychain \
            --options runtime --timestamp \
            --preserve-metadata=identifier,entitlements,requirements,flags \
            "$SPARKLE_FW"

          /usr/bin/codesign --force --sign "$IDENTITY" \
            --keychain build.keychain \
            --options runtime --timestamp \
            --entitlements "$APP_ENTITLEMENTS" \
            --preserve-metadata=identifier,requirements,flags \
            "$APP_PATH"

          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          /usr/bin/codesign -d --entitlements :- "$APP_PATH" 2>/dev/null | /usr/bin/grep -q "get-task-allow" && {
            echo "ERROR: get-task-allow entitlement still present after re-sign."
            /usr/bin/codesign -d --entitlements :- "$APP_PATH" || true
            exit 1
          } || true

          UPDATER_EXE="$(find "$SPARKLE_FW" -path '*/Updater.app/Contents/MacOS/Updater' | head -n 1)"
          if [ -n "$UPDATER_EXE" ]; then
            /usr/bin/codesign -d --entitlements :- "$UPDATER_EXE" 2>/dev/null | /usr/bin/grep -q "com.apple.security.automation.apple-events" || {
              echo "ERROR: Sparkle Updater executable missing AppleEvents entitlement after signing: $UPDATER_EXE"
              /usr/bin/codesign -d --entitlements :- "$UPDATER_EXE" || true
              exit 1
            }
          fi

      - name: Notarize app
        env:
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
        run: |
          if [ -z "$NOTARY_KEY_ID" ] || [ -z "$NOTARY_ISSUER_ID" ] || [ -z "$NOTARY_KEY" ]; then
            echo "Notary credentials missing. Set APPLE_NOTARY_KEY_ID, APPLE_NOTARY_ISSUER_ID, APPLE_NOTARY_PRIVATE_KEY."
            exit 1
          fi
          APP_PATH="$DERIVED_DATA/Build/Products/Release/$APP_NAME.app"
          NOTARY_ZIP="$RUNNER_TEMP/$APP_NAME-notary.zip"
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$NOTARY_KEY" > "$NOTARY_KEY_PATH"
          # notarytool requires a .zip/.dmg/.pkg. Zip the .app for submission.
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$NOTARY_ZIP"
          xcrun notarytool submit "$NOTARY_ZIP" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait \
            --output-format json > "$RUNNER_TEMP/notary-result.json"

          # Export vars for this step (GITHUB_ENV is only applied to subsequent steps).
          eval "$(python3 - <<'PY'
          import json, os, sys
          p = os.environ["RUNNER_TEMP"] + "/notary-result.json"
          with open(p, "r", encoding="utf-8") as f:
              data = json.load(f)
          # notarytool returns keys: id, status, message (optional)
          sub_id = data.get("id", "")
          status = (data.get("status") or "").strip()
          if not sub_id:
              sys.stderr.write("Missing submission id from notarytool output.\n")
              sys.exit(1)
          print(f'NOTARY_SUBMISSION_ID="{sub_id}"')
          print(f'NOTARY_STATUS="{status}"')
          PY
          )"

          echo "Notary submission id: ${NOTARY_SUBMISSION_ID}"
          echo "Notary status: ${NOTARY_STATUS}"

          if [ "${NOTARY_STATUS}" != "Accepted" ]; then
            echo "Notarization failed (status: ${NOTARY_STATUS}). Fetching notary log..."
            NOTARY_LOG_PATH="$RUNNER_TEMP/notary-log.json"
            xcrun notarytool log "${NOTARY_SUBMISSION_ID}" \
              --key "$NOTARY_KEY_PATH" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" \
              "$NOTARY_LOG_PATH" || true
            if [ -f "$NOTARY_LOG_PATH" ]; then
              cat "$NOTARY_LOG_PATH"
            fi
            exit 1
          fi

          xcrun stapler staple "$APP_PATH"

      - name: Package app
        run: |
          mkdir -p "$DIST_DIR"
          APP_PATH="$DERIVED_DATA/Build/Products/Release/$APP_NAME.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$DIST_DIR/$APP_NAME.zip"

      - name: Write Sparkle private key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          echo "$SPARKLE_PRIVATE_KEY" > sparkle_private_key
          chmod 600 sparkle_private_key

      - name: Generate appcast
        working-directory: ${{ env.DIST_DIR }}
        run: |
          "$SPARKLE_APPCAST_TOOL" \
            --ed-key-file "$GITHUB_WORKSPACE/sparkle_private_key" \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/" \
            "."

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.DIST_DIR }}/${{ env.APP_NAME }}.zip
            ${{ env.DIST_DIR }}/appcast.xml
