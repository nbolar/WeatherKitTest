name: Release

on:
  release:
    types: [published]

jobs:
  build-and-release:
    runs-on: macos-26
    permissions:
      contents: write

    env:
      APP_NAME: WeatherKitTest
      DERIVED_DATA: /tmp/DerivedData
      DIST_DIR: /tmp/dist

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Download Sparkle tools
        run: |
          SPARKLE_VERSION="2.8.1"
          curl -L -o sparkle.tar.xz "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          tar -xf sparkle.tar.xz
          GENERATE_APPCAT_PATH="$(find "$PWD" -type f \( -name 'generate_appcast' -o -name 'generate-appcast' \) | head -n 1)"
          SPARKLE_BIN="$(dirname "$GENERATE_APPCAT_PATH")"
          echo "SPARKLE_BIN=$SPARKLE_BIN" >> "$GITHUB_ENV"
          echo "SPARKLE_APPCAST_TOOL=$GENERATE_APPCAT_PATH" >> "$GITHUB_ENV"

      - name: Import signing certificate
        env:
          CERT_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$CERT_BASE64" ]; then
            echo "No Developer ID certificate provided. Skipping codesign import."
            exit 0
          fi
          echo "$CERT_BASE64" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -l build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain
          security find-identity -p codesigning -v build.keychain

      - name: Install WeatherKit provisioning profile
        env:
          WK_PROFILE_BASE64: ${{ secrets.WEATHERKIT_PROFILE_BASE64 }}
        run: |
          if [ -z "$WK_PROFILE_BASE64" ]; then
            echo "WeatherKit provisioning profile not provided."
            exit 1
          fi
          PROFILE_PATH="$RUNNER_TEMP/WeatherKit.provisionprofile"
          echo "$WK_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.provisionprofile
          echo "WK_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Build app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          xcodebuild \
            -project WeatherKitTest.xcodeproj \
            -scheme WeatherKitTest \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath "$DERIVED_DATA" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application: Nikhil Bolar (KALT4PNG4U)" \
            CODE_SIGN_KEYCHAIN=build.keychain \
            OTHER_CODE_SIGN_FLAGS="--keychain build.keychain" \
            DEVELOPMENT_TEAM="KALT4PNG4U" \
            PROVISIONING_PROFILE_SPECIFIER="$WK_PROFILE_UUID" \
            PROVISIONING_PROFILE="$WK_PROFILE_UUID" \
            MACOSX_DEPLOYMENT_TARGET=15.5 \
            build

      - name: Package app
        run: |
          mkdir -p "$DIST_DIR"
          APP_PATH="$DERIVED_DATA/Build/Products/Release/$APP_NAME.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$DIST_DIR/$APP_NAME.zip"

      - name: Write Sparkle private key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          echo "$SPARKLE_PRIVATE_KEY" > sparkle_private_key
          chmod 600 sparkle_private_key

      - name: Generate appcast
        working-directory: ${{ env.DIST_DIR }}
        run: |
          "$SPARKLE_APPCAST_TOOL" \
            --ed-key-file "$GITHUB_WORKSPACE/sparkle_private_key" \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/" \
            "."

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.DIST_DIR }}/${{ env.APP_NAME }}.zip
            ${{ env.DIST_DIR }}/appcast.xml
